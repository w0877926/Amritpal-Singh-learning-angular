<div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

<div *ngFor="let car of cars; let i = index">
  <app-car-list-item [car]="car" [isEven]="i % 2 === 0" ></app-car-list-item>


  <div class="car-actions">
    <button (click)="onEdit(car.id)" highlightOnFocus="orange" hoverHighlight="blue">Edit</button>
    <button (click)="onDelete(car.id)" highlightOnFocus="orange" hoverHighlight="blue">Delete</button>
  </div>
</div>
