<h2>{{ editingCarId ? 'Edit Muscle Car' : 'Add a New Muscle Car' }}</h2>

<form [formGroup]="carForm" (ngSubmit)="onSubmit()">
  <label>Make:</label>
  <input formControlName="make" type="text">

  <label>Model:</label>
  <input formControlName="model" type="text">

  <label>Year:</label>
  <input formControlName="year" type="number">

  <label>Horsepower:</label>
  <input formControlName="horsepower" type="number">

  <label>Top Speed (mph):</label>
  <input formControlName="topSpeed" type="number">

  <label>Estimated Value</label>
  <input formControlName="price" type="number">

  <label>Added to Garage:</label>
  <input formControlName="addedDate" type="date">

  <label>
    <input formControlName="isClassic" type="checkbox"> Classic?
  </label>

  <label>Image URL:</label>
  <input formControlName="image" type="text">

  <button type="submit">{{ editingCarId ? 'Update Car' : 'Add Car' }}</button>
  <button type="button" (click)="onReset()">Reset</button>
</form>

<div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>
