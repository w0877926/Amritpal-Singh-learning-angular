<h2>{{ editingCarId ? "Edit Muscle Car" : "Add a New Muscle Car" }}</h2>

<form [formGroup]="carForm" (ngSubmit)="onSubmit()">

  <mat-form-field appearance="outline">
    <mat-label>Make</mat-label>
    <input matInput formControlName="make" matTooltip="Enter the brand">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Model</mat-label>
    <input matInput formControlName="model" matTooltip="Enter the model">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Year</mat-label>
    <input matInput type="number" formControlName="year" matTooltip="Enter a valid year">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Horsepower</mat-label>
    <input matInput type="number" formControlName="horsepower" matTooltip="Enter horsepower">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Top Speed</mat-label>
    <input matInput type="number" formControlName="topSpeed" matTooltip="Enter top speed">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Estimated Value</mat-label>
    <input matInput type="number" formControlName="price" matTooltip="Enter estimated market value">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Added Date</mat-label>
    <input matInput type="date" formControlName="addedDate" matTooltip="Date car was added">
  </mat-form-field>

  <mat-checkbox formControlName="isClassic" matTooltip="Check if this is a classic muscle car">
    Classic?
  </mat-checkbox>

  <mat-form-field appearance="outline">
    <mat-label>Image URL</mat-label>
    <input matInput formControlName="image" matTooltip="Enter picture URL">
  </mat-form-field>

  <div class="form-buttons">
    <button mat-raised-button color="primary" type="submit">
      {{ editingCarId ? "Update Car" : "Add Car" }}
    </button>

    <button mat-stroked-button type="button" color="accent" (click)="onReset()">
      Reset
    </button>
  </div>

</form>

<div *ngIf="errorMessage" class="error">
  {{ errorMessage }}
</div>
