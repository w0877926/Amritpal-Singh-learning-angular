<mat-toolbar color="primary" class="nav-bar">
  <span class="title">{{ title }}</span>

  <span class="spacer"></span>

  <button mat-button routerLink="/"><mat-icon>home</mat-icon>Home</button>

  <button mat-button routerLink="/modify"><mat-icon>edit</mat-icon>Modify List</button>
</mat-toolbar>

<div id="muscle-car">
  <section *ngIf="featured">
    <h2>Featured Car</h2>

    <mat-card class="featured-card" appearance="outlined">
      <img mat-card-image [src]="featured.image" alt="{{ featured.make }} {{ featured.model }}" class="featured-img">

      <mat-card-header>
        <mat-card-title>{{ featured.make }} {{ featured.model }}</mat-card-title>
        <mat-card-subtitle *ngIf="featured.isClassic">CLASSIC MUSCLE CAR</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <p>Horsepower: {{ featured.horsepower }}</p>
        <p>Top Speed: {{ featured.topSpeed }} mph</p>
        <p>Added to Garage: {{ featured.addedDate | date }}</p>
        <p>Estimated Value: {{ featured.price | currency:'USD' }}</p>
      </mat-card-content>
    </mat-card>
  </section>

  <h2>All Cars</h2>
  <router-outlet></router-outlet>
</div>
